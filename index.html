<html lang="ko">

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      padding: 24px 16px;
      color: #333;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.2s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #2d3748;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 22px;
    }

    /* 카테고리 탭 선택 바 */
    .category-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #edf2f7;
      padding: 5px;
      border-radius: 16px;
      margin-bottom: 22px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #718096;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
    }

    .tab-btn:hover {
      color: #2d3748;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #ff5252;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
    }

    /* 결과 디스플레이 영역 */
    .result-container {
      background: #f7fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 20px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 22px 18px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .result-container.active {
      border-color: #ff6b6b;
      background: #fff5f5;
      transform: scale(1.01);
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.12);
    }

    .emoji {
      font-size: 3.8rem;
      line-height: 1.1;
      margin-bottom: 8px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #e53e3e;
      background: #ffe3e3;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .menu-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1a202c;
      word-break: keep-all;
      margin-bottom: 12px;
    }

    /* 맛집 추천 박스 */
    .restaurant-box {
      background: #ffffff;
      border-radius: 14px;
      padding: 12px 14px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid #fed7d7;
      margin-top: 4px;
    }

    .restaurant-header {
      font-size: 0.82rem;
      color: #e53e3e;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    .restaurant-names {
      font-size: 0.95rem;
      font-weight: 700;
      color: #2d3748;
      line-height: 1.4;
      word-break: keep-all;
      margin-bottom: 10px;
    }

    /* 지도 바로가기 버튼 그룹 */
    .map-links {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .map-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;

    .map-btn-naver {
      background-color: #03c75a;
      color: #ffffff;
    }

    .map-btn-naver:hover {
      background-color: #02b150;
      transform: translateY(-1px);
    }

    .map-btn-kakao {
      background-color: #fee500;
      color: #191919;
    }

    .map-btn-kakao:hover {
      background-color: #fada0a;
      transform: translateY(-1px);
    }

    .placeholder-text {
      color: #a0aec0;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .placeholder-icon {
      font-size: 3rem;
      opacity: 0.75;
    }

    /* 추천 버튼 */
    .btn-recommend {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
      color: #fff;
      border: none;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 107, 107, 0.35);
      transition: all 0.2s ease;
      width: 100%;
      outline: none;
    }

    .btn-recommend:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px rgba(255, 107, 107, 0.45);
    }

    .btn-recommend:active {
      transform: translateY(1px);
      box-shadow: 0 6px 12px rgba(255, 107, 107, 0.3);
    }

    .btn-recommend:disabled {
      background: #cbd5e0;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* 통통 튀는 애니메이션 */
    .pop {
      animation: popAnim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popAnim {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 축하 색종이 효과 */
    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    let isRolling = false;
    let lastIndex = -1;

    // 카테고리 탭 클릭 이벤트
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRolling) return;
        
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-category');

        const categoryEmojis = {
          '전체': '🍽️',
          '한식': '🍚',
          '일식': '🍣',
          '중식': '🥟'
        };

        if (content.style.display === 'none') {
          placeholderIcon.textContent = categoryEmojis[currentCategory];
          placeholderLabel.textContent = currentCategory === '전체' 
            ? '카테고리를 고르고 추천 버튼을 눌러보세요!' 
            : `${currentCategory} 메뉴를 추천해드릴게요!`;
        }
      });
    });

    function getFilteredList() {
      if (currentCategory === '전체') {
        return menuList;
      }
      return menuList.filter(item => item.category === currentCategory);
    }

    function getRandomMenu() {
      const filtered = getFilteredList();
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * filtered.length);
      } while (nextIndex === lastIndex && filtered.length > 1);
      
      lastIndex = nextIndex;
      return filtered[nextIndex];
    }

    function recommendMenu() {
      if (isRolling) return;
      isRolling = true;
      btnRecommend.disabled = true;
      btnRecommend.innerText = "메뉴와 맛집 찾는 중...";

      placeholder.style.display = 'none';
      content.style.display = 'block';
      resultContainer.classList.add('active');

      let count = 0;
      const totalSteps = 16;
      let delay = 50;

      function roll() {
        const item = getRandomMenu();
        menuEmoji.textContent = item.emoji;
        menuName.textContent = item.name;
        categoryBadge.textContent = item.category;
        restaurantNames.textContent = item.restaurants || "추천 맛집 준비 중";

        count++;
        if (count < totalSteps) {
          delay += 12;
          setTimeout(roll, delay);
        } else {
          finishPick(item);
        }
      }

      roll();
    }

    function finishPick(item) {
      isRolling = false;
      btnRecommend.disabled = false;
      btnRecommend.innerText = "다시 추천받기";

      // 지도 검색 링크 갱신 (검색어 정리)
      const query = item.name.split('/')[0].split('(')[0].replace('&', ' ').trim();
      naverMapLink.href = `https://map.naver.com/p/search/${encodeURIComponent(query + ' 맛집')}`;
      kakaoMapLink.href = `https://map.kakao.com/?q=${encodeURIComponent(query + ' 맛집')}`;

      // 팝 애니메이션 적용
      content.classList.remove('pop');
      void content.offsetWidth;
      content.classList.add('pop');

      // 축하 컨페티 효과 발생
      fireConfetti();
    }

    btnRecommend.addEventListener('click', recommendMenu);

    // 심플하고 가벼운 캔버스 파티클(컨페티) 효과
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#54a0ff'];
      particles = [];
      const particleCount = 45;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 80,
          y: canvas.height / 2 + 50,
          vx: (Math.random() - 0.5) * 14,
          vy: -(Math.random() * 10 + 6),
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          gravity: 0.35,
          opacity: 1
        });
      }

      if (!animating) {
        animating = true;
        animateConfetti();
      }
    }

    let animating = false;
    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotationSpeed;
        p.opacity -= 0.015;

        if (p.opacity <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }

      if (particles.length > 0) {
        requestAnimationFrame(animateConfetti);
      } else {
        animating = false;
      }
    }
  </script>
</body>
